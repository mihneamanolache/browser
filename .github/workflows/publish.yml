name: publish

# Builds this fork and publishes it to the repo's own GitHub Container
# Registry, for linux/amd64 and linux/arm64, plus raw binaries for macOS.
#
# Each architecture builds on its OWN native runner. The obvious alternative --
# one buildx job with QEMU -- emulates the V8 link step, which turns ~5 minutes
# into something that routinely exceeds the job timeout. So: native binary per
# arch, a thin single-arch image per arch (Dockerfile.dist just copies the
# binary in), then `docker manifest` joins them into one multi-arch tag.
#
# Upstream's release.yml pushes to S3 with credentials this fork does not have.
# This workflow deliberately shares none of that: it needs only GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: branch or git tag)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

# The Linux and macOS builds are separate JOBS, not two halves of one matrix,
# because `needs:` is job-level: a single failed matrix entry fails the whole
# job and skips everything downstream. That is how a macOS runner that would
# not start -- billing, availability, anything -- took the container image
# down with it, and the image is the artifact anything actually deploys.
# Linux now stands alone, and macOS can fail without consequence.
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            runner: ubuntu-22.04
            cpu_flag: -Dcpu=x86_64
          - arch: aarch64
            docker_arch: arm64
            # apt.llvm.org has no LLVM 23 repo for 22.04; see upstream
            # zig-v8-fork#199. Same reason as release.yml.
            runner: ubuntu-24.04-arm
            cpu_flag: -Dcpu=generic

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          os: linux
          arch: ${{ matrix.arch }}

      # The snapshot has to be built by the same binary that will embed it.
      - name: v8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: build
        run: |
          ORDERFILE="-Dorderfile=orderfile/lightpanda.ld"
          zig build \
            -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Doptimize=ReleaseFast \
            $ORDERFILE ${{ matrix.cpu_flag }} \
            -Dversion=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: rename
        run: mv zig-out/bin/lightpanda lightpanda-${{ matrix.arch }}-linux

      # Smoke test: a binary that cannot report its own identity is not worth
      # publishing, and this catches a broken snapshot or V8 link immediately.
      #
      # Over HTTP, not file://, which `fetch` does not support. The page is
      # served locally so the test needs no network and cannot flake on one.
      - name: smoke test
        run: |
          BIN=./lightpanda-${{ matrix.arch }}-linux
          # `version` is a subcommand, not a flag: `--version` exits
          # UnknownCommand, and a bash -e step dies there before it tests
          # anything. That typo is why no publish has ever reached the image.
          $BIN version
          $BIN fetch --fingerprint-list | grep -q "macbook" || (echo "profile table missing" && exit 1)

          mkdir -p /tmp/smoke
          cat > /tmp/smoke/ua.html <<'HTML'
          <html><body><pre id=o></pre><script>
          document.getElementById("o").textContent =
            navigator.userAgent + "|" + navigator.platform + "|" + screen.width;
          </script></body></html>
          HTML
          python3 -m http.server 8731 --directory /tmp/smoke &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for _ in $(seq 20); do curl -sf -o /dev/null http://127.0.0.1:8731/ua.html && break; sleep 0.5; done

          # --fingerprint pins the profile so the assertion is about the build
          # and not about which machine the seed happened to draw.
          OUT=$($BIN fetch http://127.0.0.1:8731/ua.html --dump html \
                  --fingerprint macbook-pro-14-m2pro --log-level error)
          echo "$OUT" | grep -q "Chrome/" || (echo "identity missing from build" && exit 1)
          echo "$OUT" | grep -q "MacIntel|1512" || (echo "profile not applied" && exit 1)
          echo "identity OK"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightpanda-${{ matrix.arch }}-linux
          path: lightpanda-${{ matrix.arch }}-linux
          retention-days: 7

  # Raw macOS binaries. Nothing depends on this job, on purpose.
  #
  # Only the free arm64 runner: macos-14-large is a paid larger runner, and a
  # lapsed payment there is what broke the first publish. Add an x86_64 entry
  # back when that account has billing, and it still cannot block the image.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install
        with:
          os: macos
          arch: ${{ matrix.arch }}

      - name: v8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: build
        run: |
          zig build \
            -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a \
            -Doptimize=ReleaseFast \
            -Dversion=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: rename
        run: mv zig-out/bin/lightpanda lightpanda-${{ matrix.arch }}-macos

      - name: smoke test
        run: ./lightpanda-${{ matrix.arch }}-macos version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightpanda-${{ matrix.arch }}-macos
          path: lightpanda-${{ matrix.arch }}-macos
          retention-days: 7

  image:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            docker_arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lightpanda-${{ matrix.arch }}-linux

      - name: log in to ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase: ghcr rejects capitals in a repository name, and
      # github.repository preserves the owner's casing.
      - name: image name
        id: n
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build and push per-arch image
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
          fi
          IMG="${{ steps.n.outputs.image }}"
          docker build -f Dockerfile.dist \
            --build-arg BIN=lightpanda-${{ matrix.arch }}-linux \
            -t "$IMG:${TAG}-${{ matrix.docker_arch }}" \
            -t "$IMG:${{ github.sha }}-${{ matrix.docker_arch }}" .
          docker push "$IMG:${TAG}-${{ matrix.docker_arch }}"
          docker push "$IMG:${{ github.sha }}-${{ matrix.docker_arch }}"

  manifest:
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: log in to ghcr
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag that resolves to the right arch on pull, built from the
      # per-arch tags the previous job pushed.
      - name: join into a multi-arch tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
          fi
          IMG=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')
          for T in "$TAG" "${{ github.sha }}"; do
            docker manifest create "$IMG:$T" \
              --amend "$IMG:${T}-amd64" \
              --amend "$IMG:${T}-arm64"
            docker manifest push "$IMG:$T"
            echo "pushed $IMG:$T (amd64 + arm64)"
          done
