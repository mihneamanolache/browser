<script>
(() => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 2;
  const gl = canvas.getContext('webgl');
  if (!gl) {
    document.querySelector('#result').textContent = JSON.stringify({error: 'no WebGL context'});
    return;
  }
  const shader = (type, source) => {
    const value = gl.createShader(type);
    gl.shaderSource(value, source);
    gl.compileShader(value);
    return value;
  };
  const vertex = shader(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.0,1.0);}');
  const fragment = shader(gl.FRAGMENT_SHADER, 'precision mediump float; void main(){gl_FragColor=vec4(gl_FragCoord.xy/2.0,0.5,0.5);}');
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const location = gl.getAttribLocation(program, 'a');
  if (location >= 0) {
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, 2, 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  const pixels = new Uint8Array(16);
  gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = {
    vendor: gl.getParameter(gl.VENDOR),
    renderer: gl.getParameter(gl.RENDERER),
    unmaskedVendor: debugInfo && gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
    unmaskedRenderer: debugInfo && gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL),
    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    maxViewportDims: Array.from(gl.getParameter(gl.MAX_VIEWPORT_DIMS))
  };
  document.querySelector('#gpu').textContent = JSON.stringify(gpu);
  document.querySelector('#result').textContent = JSON.stringify({
    vertexCompiled: gl.getShaderParameter(vertex, gl.COMPILE_STATUS),
    fragmentCompiled: gl.getShaderParameter(fragment, gl.COMPILE_STATUS),
    linked: gl.getProgramParameter(program, gl.LINK_STATUS),
    attachedShaders: gl.getProgramParameter(program, gl.ATTACHED_SHADERS),
    activeAttributes: gl.getProgramParameter(program, gl.ACTIVE_ATTRIBUTES),
    activeUniforms: gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS),
    activeAttribute0: (() => {
      const info = gl.getActiveAttrib(program, 0);
      return info && {name: info.name, size: info.size, type: info.type};
    })(),
    environment: {
      language: navigator.language,
      languages: navigator.languages,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      screen: [screen.width, screen.height, screen.availWidth, screen.availHeight, devicePixelRatio],
      cores: navigator.hardwareConcurrency,
      memory: navigator.deviceMemory
    },
    gpu,
    location,
    pixels: Array.from(pixels),
    error: gl.getError()
  });
})();
</script>
<script>
(() => {
  const gl = document.createElement('canvas').getContext('webgl');
  const program = gl.createProgram();
  const before = [gl.getAttachedShaders(program).length, gl.getProgramParameter(program, gl.VALIDATE_STATUS)];
  const vertex = gl.createShader(gl.VERTEX_SHADER);
  const fragment = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(vertex, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.0,1.0);}');
  gl.shaderSource(fragment, 'precision mediump float; void main(){gl_FragColor=vec4(1.0);}');
  gl.compileShader(vertex);
  gl.compileShader(fragment);
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  const attached = gl.getAttachedShaders(program);
  const attachment = [gl.getProgramParameter(program, gl.ATTACHED_SHADERS), attached.length, attached[0] === vertex, attached[1] === fragment];
  gl.linkProgram(program);
  gl.validateProgram(program);
  const linked = [gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramParameter(program, gl.VALIDATE_STATUS), gl.getProgramInfoLog(program)];
  gl.detachShader(program, vertex);
  const afterDetach = [gl.getProgramParameter(program, gl.ATTACHED_SHADERS), gl.getAttachedShaders(program).length, gl.getAttachedShaders(program)[0] === fragment];
  gl.deleteShader(vertex);
  const deleted = [gl.isShader(vertex), gl.getShaderParameter(vertex, gl.DELETE_STATUS)];
  const bad = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(bad, 'not glsl');
  gl.compileShader(bad);
  const failed = [gl.getShaderParameter(bad, gl.COMPILE_STATUS), gl.getShaderInfoLog(bad), gl.getShaderSource(bad)];
  document.querySelector('#programLifecycle').textContent = JSON.stringify({before, attachment, linked, afterDetach, deleted, failed, error: gl.getError()});
})();
</script>

  gl.activeTexture(gl.TEXTURE1);
