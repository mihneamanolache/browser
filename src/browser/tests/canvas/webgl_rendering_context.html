<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_disjoint_timer_query",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "KHR_parallel_shader_compile",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_blend_func_extended",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_pvrtc",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGL2RenderingContext#fingerprint_surface>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl2');
  testing.expectEqual(true, ctx instanceof WebGL2RenderingContext);
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);
  testing.expectEqual(true, ctx === element.getContext('webgl2'));
  testing.expectEqual(null, element.getContext('webgl'));
  testing.expectEqual('WebGL 2.0 (OpenGL ES 3.0 Chromium)', ctx.getParameter(ctx.VERSION));
  testing.expectEqual('WebGL GLSL ES 3.00 (OpenGL ES GLSL ES 3.0 Chromium)', ctx.getParameter(ctx.SHADING_LANGUAGE_VERSION));
  testing.expectEqual('srgb', ctx.drawingBufferColorSpace);
  testing.expectEqual('srgb', ctx.unpackColorSpace);
  testing.expectEqual(0x8DF0, ctx.LOW_FLOAT);
  testing.expectEqual(0x8DF2, ctx.HIGH_FLOAT);
  testing.expectEqual(0x8DF5, ctx.HIGH_INT);
  testing.expectEqual(4096, ctx.getParameter(ctx.MAX_VERTEX_UNIFORM_COMPONENTS));
  testing.expectEqual(16384, ctx.getParameter(ctx.MAX_UNIFORM_BLOCK_SIZE));
  testing.expectEqual(256, ctx.getParameter(ctx.UNIFORM_BUFFER_OFFSET_ALIGNMENT));
}
</script>

<script id=WebGL2RenderingContext#own_webgl1_surface>
{
  // Headful Chrome installs WebGL1's constants and operations as own
  // properties of WebGL2RenderingContext.prototype, not just inherited ones.
  const gl1 = WebGLRenderingContext.prototype;
  const gl2 = WebGL2RenderingContext.prototype;
  for (const name of Object.getOwnPropertyNames(gl1)) {
    if (name === 'constructor') continue;
    const first = Object.getOwnPropertyDescriptor(gl1, name);
    const second = Object.getOwnPropertyDescriptor(gl2, name);
    testing.expectEqual(true, !!second);
    testing.expectEqual(first.configurable, second.configurable);
    testing.expectEqual(first.enumerable, second.enumerable);
    if ('value' in first) {
      testing.expectEqual(first.writable, second.writable);
      testing.expectEqual(typeof first.value, typeof second.value);
      if (typeof first.value === 'function') {
        testing.expectEqual(first.value.length, second.value.length);
      } else {
        testing.expectEqual(first.value, second.value);
      }
    } else {
      testing.expectEqual(!!first.get, !!second.get);
      testing.expectEqual(!!first.set, !!second.set);
    }
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectEqual('undefined', typeof WEBGL_debug_renderer_info);
  testing.expectEqual('object', typeof rendererInfo);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  // Chrome masks the real GPU behind VENDOR/RENDERER and only reveals the
  // true strings through this extension.
  testing.expectEqual("Google Inc. (Apple)", ctx.getParameter(UNMASKED_VENDOR_WEBGL));
  testing.expectEqual(
    "ANGLE (Apple, ANGLE Metal Renderer: Apple M2 Pro, Unspecified Version)",
    ctx.getParameter(UNMASKED_RENDERER_WEBGL));
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectEqual('undefined', typeof WEBGL_lose_context);
  testing.expectEqual('object', typeof loseContext);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=getParameter_limits>
{
  const ctx = document.createElement('canvas').getContext('webgl');

  testing.expectEqual(16384, ctx.getParameter(0x0D33)); // MAX_TEXTURE_SIZE
  testing.expectEqual(16, ctx.getParameter(0x8869));    // MAX_VERTEX_ATTRIBS
  testing.expectEqual(24, ctx.getParameter(0x0D56));    // DEPTH_BITS
  testing.expectEqual(8, ctx.getParameter(0x0D52));     // RED_BITS

  // MAX_VIEWPORT_DIMS is an Int32Array in Chrome, and callers index into it.
  const dims = ctx.getParameter(0x0D3A);
  testing.expectEqual(true, dims instanceof Int32Array);
  testing.expectEqual(16384, dims[0]);
  testing.expectEqual(16384, dims[1]);

  const lineWidth = ctx.getParameter(0x846E); // ALIASED_LINE_WIDTH_RANGE
  testing.expectEqual(true, lineWidth instanceof Float32Array);
  testing.expectEqual(1, lineWidth[0]);

  // Booleans and boolean arrays keep their types too.
  testing.expectEqual(false, ctx.getParameter(0x0BE2));  // BLEND
  testing.expectEqual(true, ctx.getParameter(0x0BD0));   // DITHER
  testing.expectEqual(4, ctx.getParameter(0x0C23).length); // COLOR_WRITEMASK
}
</script>

<script id=renderer_setup_path_completes>
{
  // The reason getContext no longer returns null: a renderer has to be able
  // to run its whole setup path without throwing. Shader draws remain no-ops;
  // default-buffer clear and readback work.
  const ctx = document.createElement('canvas').getContext('webgl');

  const vs = ctx.createShader(0x8B31); // VERTEX_SHADER
  const fs = ctx.createShader(0x8B30); // FRAGMENT_SHADER
  testing.expectEqual(true, vs instanceof WebGLShader);

  const vertexSource = 'void main() { gl_Position = vec4(0.0); }';
  ctx.shaderSource(vs, vertexSource);
  ctx.compileShader(vs);
  // A false COMPILE_STATUS is what sends consumers into their throw path.
  testing.expectEqual(true, ctx.getShaderParameter(vs, 0x8B81));
  testing.expectEqual('', ctx.getShaderInfoLog(vs));
  testing.expectEqual(vertexSource, ctx.getShaderSource(vs));

  ctx.shaderSource(fs, 'precision mediump float; uniform vec4 uColor; void main() { gl_FragColor = uColor; }');
  ctx.compileShader(fs);
  testing.expectEqual(true, ctx.getShaderParameter(fs, 0x8B81));

  const program = ctx.createProgram();
  ctx.attachShader(program, vs);
  ctx.attachShader(program, fs);
  ctx.linkProgram(program);
  testing.expectEqual(true, ctx.getProgramParameter(program, 0x8B82)); // LINK_STATUS
  testing.expectEqual('', ctx.getProgramInfoLog(program));
  ctx.useProgram(program);

  const buffer = ctx.createBuffer();
  testing.expectEqual(true, buffer instanceof WebGLBuffer);
  testing.expectEqual(true, buffer instanceof WebGLObject);
  testing.expectEqual(WebGLObject.prototype, Object.getPrototypeOf(WebGLBuffer.prototype));
  testing.expectEqual(true, vs instanceof WebGLObject);
  ctx.bindBuffer(0x8892, buffer);
  ctx.bufferData(0x8892, new Float32Array([0, 1, 2]), 0x88E4);

  const texture = ctx.createTexture();
  testing.expectEqual(true, texture instanceof WebGLTexture);
  ctx.bindTexture(0x0DE1, texture);
  ctx.texParameteri(0x0DE1, 0x2801, 0x2601);

  const fb = ctx.createFramebuffer();
  ctx.bindFramebuffer(0x8D40, fb);
  ctx.framebufferTexture2D(0x8D40, 0x8CE0, 0x0DE1, texture, 0);
  testing.expectEqual(ctx.isFramebuffer(fb) ? 0x8CD6 : 0x8CD5, ctx.checkFramebufferStatus(0x8D40)); // Unallocated texture is incomplete on native GL.
  ctx.bindFramebuffer(0x8D40, null);

  const loc = ctx.getUniformLocation(program, 'uColor');
  testing.expectEqual(true, loc instanceof WebGLUniformLocation);
  testing.expectEqual(false, loc instanceof WebGLObject);
  ctx.uniform4f(loc, 1, 1, 1, 1);
  ctx.uniformMatrix4fv(loc, false, new Float32Array(16));

  ctx.viewport(0, 0, 300, 150);
  ctx.clearColor(0, 0, 0, 1);
  ctx.clear(0x4000);
  ctx.drawArrays(0x0004, 0, 3);
  ctx.drawElements(0x0004, 3, 0x1403, 0);
  ctx.flush();
  ctx.finish();

  // Still no error, and the context is not lost.
  testing.expectEqual(0, ctx.getError());
  testing.expectEqual(false, ctx.isContextLost());

  ctx.deleteBuffer(buffer);
  ctx.deleteTexture(texture);
  ctx.deleteProgram(program);
}
</script>

<script id=native_angle_framebuffer_storage>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const initial = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  if (gl.isFramebuffer(framebuffer)) {
    testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, initial);
    testing.expectEqual(gl.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    const renderbuffer = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffer);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, renderbuffer);
    testing.expectEqual(gl.FRAMEBUFFER_INCOMPLETE_ATTACHMENT, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA4, 2, 2);
    testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    gl.clearColor(0.25, 0.5, 0.75, 0.5);
    gl.clear(gl.COLOR_BUFFER_BIT);
    const pixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
    testing.expectEqual([68, 136, 187, 136], Array.from(pixel));
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, null);
    testing.expectEqual(gl.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    const defaultPixel = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, defaultPixel);
    testing.expectEqual([0, 0, 0, 0], Array.from(defaultPixel));
    testing.expectEqual(gl.NO_ERROR, gl.getError());
  }
}
</script>

<script id=native_angle_texture_sampling>
{
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 2;
  const gl = canvas.getContext('webgl');
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  if (gl.isTexture(texture)) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const input = new Uint8Array([255,0,0,255, 0,255,0,255, 0,0,255,255, 255,255,255,255]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, input);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    const stored = new Uint8Array(16);
    gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, stored);
    testing.expectEqual(Array.from(input), Array.from(stored));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const shader = (type, source) => {
      const value = gl.createShader(type);
      gl.shaderSource(value, source);
      gl.compileShader(value);
      return value;
    };
    const vertex = shader(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.0,1.0);}');
    const fragment = shader(gl.FRAGMENT_SHADER, 'precision mediump float; uniform sampler2D uTexture; void main(){gl_FragColor=texture2D(uTexture,gl_FragCoord.xy/2.0);}');
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    gl.useProgram(program);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
    const attribute = gl.getAttribLocation(program, 'a');
    gl.enableVertexAttribArray(attribute);
    gl.vertexAttribPointer(attribute, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, 2, 2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const sampled = new Uint8Array(16);
    gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, sampled);
    testing.expectEqual(Array.from(input), Array.from(sampled));
    testing.expectEqual(gl.NO_ERROR, gl.getError());
  }
}
</script>

<script id=native_angle_texture_pixel_store>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  if (gl.isTexture(texture)) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    testing.expectEqual([4, false, false, gl.BROWSER_DEFAULT_WEBGL], [gl.getParameter(gl.UNPACK_ALIGNMENT), gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL), gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL), gl.getParameter(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL)]);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    testing.expectEqual([1, true, true, 0], [gl.getParameter(gl.UNPACK_ALIGNMENT), gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL), gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL), gl.getParameter(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL)]);
    const input = new Uint8Array([10,20,30,128, 40,50,60,255, 70,80,90,64, 100,110,120,0]);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, input);
    const output = new Uint8Array(16);
    gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, output);
    testing.expectEqual(gl.FRAMEBUFFER_COMPLETE, gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    testing.expectEqual([17,20,22,64, 0,0,0,0, 5,10,15,128, 40,50,60,255], Array.from(output));
    testing.expectEqual(gl.NO_ERROR, gl.getError());
  }
}
</script>

<script id=native_angle_texture_validation>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  if (gl.isTexture(texture)) {
    testing.expectEqual([4, gl.BROWSER_DEFAULT_WEBGL, gl.NO_ERROR], [gl.getParameter(gl.UNPACK_ALIGNMENT), gl.getParameter(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL), gl.getError()]);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 3);
    testing.expectEqual([4, gl.INVALID_VALUE, gl.NO_ERROR], [gl.getParameter(gl.UNPACK_ALIGNMENT), gl.getError(), gl.getError()]);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, 42);
    testing.expectEqual([gl.BROWSER_DEFAULT_WEBGL, gl.INVALID_VALUE, gl.NO_ERROR], [gl.getParameter(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL), gl.getError(), gl.getError()]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
    testing.expectEqual([gl.INVALID_OPERATION, gl.NO_ERROR], [gl.getError(), gl.getError()]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array(16));
    testing.expectEqual([gl.INVALID_OPERATION, gl.NO_ERROR], [gl.getError(), gl.getError()]);
  }
}
</script>

<script id=native_angle_state_queries>
{

<script id=native_angle_binding_identity>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const initial = [gl.getParameter(gl.ARRAY_BUFFER_BINDING), gl.getParameter(gl.TEXTURE_BINDING_2D), gl.getParameter(gl.FRAMEBUFFER_BINDING), gl.getParameter(gl.RENDERBUFFER_BINDING)];
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  const renderbuffer = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffer);
  if (gl.isBuffer(buffer)) {
    testing.expectEqual([null, null, null, null], initial);
    testing.expectEqual(true, gl.getParameter(gl.ARRAY_BUFFER_BINDING) === buffer);
    testing.expectEqual(true, gl.getParameter(gl.TEXTURE_BINDING_2D) === texture);
    testing.expectEqual(true, gl.getParameter(gl.FRAMEBUFFER_BINDING) === framebuffer);
    testing.expectEqual(true, gl.getParameter(gl.RENDERBUFFER_BINDING) === renderbuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    testing.expectEqual(5890, gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.FRAMEBUFFER_ATTACHMENT_OBJECT_TYPE));
    testing.expectEqual(true, gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.FRAMEBUFFER_ATTACHMENT_OBJECT_NAME) === texture);
    testing.expectEqual(0, gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.FRAMEBUFFER_ATTACHMENT_TEXTURE_LEVEL));
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, renderbuffer);
    testing.expectEqual(gl.RENDERBUFFER, gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.FRAMEBUFFER_ATTACHMENT_OBJECT_TYPE));
    testing.expectEqual(true, gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.FRAMEBUFFER_ATTACHMENT_OBJECT_NAME) === renderbuffer);
    gl.activeTexture(gl.TEXTURE1);
    testing.expectEqual(null, gl.getParameter(gl.TEXTURE_BINDING_2D));
    gl.activeTexture(gl.TEXTURE0);
    testing.expectEqual(true, gl.getParameter(gl.TEXTURE_BINDING_2D) === texture);
    testing.expectEqual(gl.NO_ERROR, gl.getError());
  }
}
</script>

<script id=native_angle_program_lifecycle>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const program = gl.createProgram();
  if (gl.isProgram(program)) {
    testing.expectEqual([0, false], [gl.getAttachedShaders(program).length, gl.getProgramParameter(program, gl.VALIDATE_STATUS)]);
    const vertex = gl.createShader(gl.VERTEX_SHADER);
    const fragment = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(vertex, 'attribute vec2 a; void main(){gl_Position=vec4(a,0.0,1.0);}');
    gl.shaderSource(fragment, 'precision mediump float; void main(){gl_FragColor=vec4(1.0);}');
    gl.compileShader(vertex);
    gl.compileShader(fragment);
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    const attached = gl.getAttachedShaders(program);
    testing.expectEqual([2, 2, true, true], [gl.getProgramParameter(program, gl.ATTACHED_SHADERS), attached.length, attached[0] === vertex, attached[1] === fragment]);
    gl.linkProgram(program);
    gl.validateProgram(program);
    testing.expectEqual([true, true, ''], [gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramParameter(program, gl.VALIDATE_STATUS), gl.getProgramInfoLog(program)]);
    gl.detachShader(program, vertex);
    testing.expectEqual([1, 1, true], [gl.getProgramParameter(program, gl.ATTACHED_SHADERS), gl.getAttachedShaders(program).length, gl.getAttachedShaders(program)[0] === fragment]);
    gl.deleteShader(vertex);
    testing.expectEqual([false, null], [gl.isShader(vertex), gl.getShaderParameter(vertex, gl.DELETE_STATUS)]);
    const bad = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(bad, 'not glsl');
    gl.compileShader(bad);
    testing.expectEqual(false, gl.getShaderParameter(bad, gl.COMPILE_STATUS));
    testing.expectEqual("ERROR: 0:1: 'not' : syntax error\n\0", gl.getShaderInfoLog(bad));
    testing.expectEqual('not glsl', gl.getShaderSource(bad));
    testing.expectEqual(gl.INVALID_VALUE, gl.getError());
  }
}

<script id=native_angle_object_lifecycle>
{
  const gl = document.createElement('canvas').getContext('webgl');
  const other = document.createElement('canvas').getContext('webgl');
  const buffer = gl.createBuffer();
  const program = gl.createProgram();
  const shader = gl.createShader(gl.VERTEX_SHADER);
  const texture = gl.createTexture();
  const framebuffer = gl.createFramebuffer();
  const renderbuffer = gl.createRenderbuffer();
  const foreign = other.createBuffer();
  if (gl.isProgram(program)) {
    testing.expectEqual(false, gl.isBuffer(buffer));
    testing.expectEqual(true, gl.isShader(shader));
    testing.expectEqual(false, gl.isTexture(texture));
    testing.expectEqual(false, gl.isFramebuffer(framebuffer));
    testing.expectEqual(false, gl.isRenderbuffer(renderbuffer));
    testing.expectEqual(false, gl.isBuffer(foreign));
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffer);
    testing.expectEqual(true, gl.isBuffer(buffer));
    testing.expectEqual(true, gl.isTexture(texture));
    testing.expectEqual(true, gl.isFramebuffer(framebuffer));
    testing.expectEqual(true, gl.isRenderbuffer(renderbuffer));
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.deleteShader(shader);
    gl.deleteTexture(texture);
    gl.deleteFramebuffer(framebuffer);
    gl.deleteRenderbuffer(renderbuffer);
    testing.expectEqual(false, gl.isBuffer(buffer));
    testing.expectEqual(false, gl.isProgram(program));
    testing.expectEqual(false, gl.isShader(shader));
    testing.expectEqual(false, gl.isTexture(texture));
    testing.expectEqual(false, gl.isFramebuffer(framebuffer));
    testing.expectEqual(false, gl.isRenderbuffer(renderbuffer));
    testing.expectEqual(gl.NO_ERROR, gl.getError());
  }
}

<script id=clear_and_read_pixels>
{
  // Measured in normal headed Chrome 151 on a 2x2 WebGL drawing buffer.
  for (const kind of ['webgl', 'webgl2']) for (const alpha of [true, false]) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 2;
    const gl = canvas.getContext(kind, {alpha});
    testing.expectEqual(alpha, gl.getContextAttributes().alpha);
    const pixels = new Uint8Array(16);
    gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    testing.expectEqual(alpha ? 0 : 255, pixels[3]);
    gl.clearColor(.2, .4, .6, .5);
    const clearColor = gl.getParameter(gl.COLOR_CLEAR_VALUE);
    testing.expectEqual(true, clearColor instanceof Float32Array);
    testing.expectEqual(Math.fround(.2), clearColor[0]);
    testing.expectEqual(Math.fround(.4), clearColor[1]);
    testing.expectEqual(Math.fround(.6), clearColor[2]);
    testing.expectEqual(.5, clearColor[3]);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (let i = 0; i < pixels.length; i += 4) {
      testing.expectEqual(51, pixels[i]);
      testing.expectEqual(102, pixels[i + 1]);
      testing.expectEqual(153, pixels[i + 2]);
      testing.expectEqual(alpha ? 128 : 255, pixels[i + 3]);
    }
    testing.expectEqual(0, gl.getError());

    canvas.width = 2;
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    testing.expectEqual(0, pixels[0]);
    testing.expectEqual(alpha ? 0 : 255, pixels[3]);
  }
}
</script>
