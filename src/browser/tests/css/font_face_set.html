<!DOCTYPE html>
<script src="../testing.js"></script>

<script id="document_fonts_exists">
{
    testing.expectTrue(document.fonts !== undefined);
    testing.expectTrue(document.fonts !== null);
}
</script>

<script id="document_fonts_same_instance">
{
    // Should return same instance each time
    const f1 = document.fonts;
    const f2 = document.fonts;
    testing.expectTrue(f1 === f2);
}
</script>

<script id="document_fonts_status">
{
    testing.expectEqual('loaded', document.fonts.status);
}
</script>

<script id="document_fonts_size">
{
    testing.expectEqual(0, document.fonts.size);
}
</script>

<script id="document_fonts_ready_is_promise">
{
    const ready = document.fonts.ready;
    testing.expectTrue(ready instanceof Promise);
    testing.expectTrue(ready === document.fonts.ready);
}
</script>

<script id="document_fonts_ready_resolves">
{
    let resolved = false;
    document.fonts.ready.then(() => { resolved = true; });
    // Promise resolution is async; just confirm .then() does not throw
    testing.expectTrue(typeof document.fonts.ready.then === 'function');
}
</script>

<script id="document_fonts_check">
{
    testing.expectTrue(document.fonts.check('16px sans-serif'));
}
</script>

<script id="document_fonts_constructor_name">
{
    testing.expectEqual('FontFaceSet', document.fonts.constructor.name);
}
</script>

<script id="document_fonts_addEventListener">
{
    let loading = false;
    document.fonts.addEventListener('loading', function() {
        loading = true;
    });

    let loadingdone = false;
    document.fonts.addEventListener('loadingdone', function() {
        loadingdone = true;
    });

    document.fonts.load("italic bold 16px Roboto");
    testing.expectEqual(false, loading);
    testing.expectEqual(false, loadingdone);
}
</script>

<script id="document_fonts_manual_faces">
{
    const face = new FontFace('AuditLocal', 'local(Arial)');
    testing.expectEqual('unloaded', face.status);
    testing.expectTrue(document.fonts.add(face) === document.fonts);
    testing.expectEqual(1, document.fonts.size);
    testing.expectTrue(document.fonts.has(face));
    testing.expectEqual(false, document.fonts.check('12px AuditLocal'));
    document.fonts.load('12px AuditLocal').then(faces => {
        testing.expectEqual(1, faces.length);
        testing.expectTrue(faces[0] === face);
        testing.expectEqual('loaded', face.status);
    });
    testing.expectTrue(document.fonts.delete(face));
    testing.expectEqual(0, document.fonts.size);
    testing.expectEqual(false, document.fonts.has(face));
}
</script>

<script id="document_fonts_css_face">
{
    const style = document.createElement('style');
    style.textContent = '@font-face { font-family: "Audit CSS"; src: local("Arial"); }';
    document.head.appendChild(style);
    testing.expectEqual(1, document.fonts.size);
    testing.expectEqual('Audit CSS', [...document.fonts][0].family);
    testing.expectEqual(false, document.fonts.check('12px Audit CSS'));
    document.fonts.load('12px Audit CSS').then(faces => {
        testing.expectEqual(1, faces.length);
        testing.expectEqual('Audit CSS', faces[0].family);
    });
    style.remove();
    testing.expectEqual(0, document.fonts.size);
}
</script>

<script id="document_fonts_css_descriptors">
{
    const style = document.createElement('style');
    style.textContent = '@font-face { font-family: "Descriptor Probe"; src: local(Arial); font-style: italic; font-weight: 400 700; font-stretch: condensed; unicode-range: U+0000-00FF,U+0131; font-feature-settings: "liga" 0; font-display: optional; }';
    document.head.appendChild(style);
    const face = [...document.fonts].find(f => f.family === 'Descriptor Probe');
    testing.expectTrue(!!face);
    testing.expectEqual('italic', face.style);
    testing.expectEqual('400 700', face.weight);
    testing.expectEqual('condensed', face.stretch);
    testing.expectEqual('U+0-FF, U+131', face.unicodeRange);
    testing.expectEqual('"liga" 0', face.featureSettings);
    testing.expectEqual('optional', face.display);
    style.remove();
}
</script>

<script id="document_fonts_url_face" type="module">
  const state = await testing.async();
  const style = document.createElement('style');
  style.textContent = '@font-face { font-family: "Bundled Test"; src: url(/font_valid.ttf); }';
  document.head.appendChild(style);
  const face = [...document.fonts].find(f => f.family === 'Bundled Test');
  testing.expectTrue(!!face);
  testing.expectEqual('unloaded', face.status);
  const loaded = await document.fonts.load('12px Bundled Test');
  state.resolve();
  await state.done(() => {
    testing.expectEqual(1, loaded.length);
    testing.expectTrue(loaded[0] === face);
    testing.expectEqual('loaded', face.status);
    testing.expectTrue(document.fonts.check('12px Bundled Test'));
    style.remove();
  });
</script>
