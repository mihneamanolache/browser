<!DOCTYPE html>
<body></body>
<script src="../testing.js"></script>

<script id="service_worker_lifecycle" type="module">
  const state = await testing.async();

  try {
    testing.expectTrue(navigator.serviceWorker instanceof ServiceWorkerContainer);
    testing.expectTrue(navigator.serviceWorker instanceof EventTarget);
    testing.expectEqual(null, navigator.serviceWorker.controller);
    testing.expectEqual('function', typeof ServiceWorker);
    testing.expectEqual('function', typeof ServiceWorkerRegistration);

    // Read ready before register: Chrome keeps this promise pending and settles
    // the same promise once an active registration exists.
    const readyPromise = navigator.serviceWorker.ready;
    let readySettled = false;
    readyPromise.then(() => { readySettled = true; });
    await Promise.resolve();
    testing.expectFalse(readySettled);

    const registration = await navigator.serviceWorker.register('./scope/sw.js', {
      scope: './scope/',
      updateViaCache: 'none',
    });
    testing.expectTrue(registration instanceof ServiceWorkerRegistration);
    testing.expectTrue(registration instanceof EventTarget);
    testing.expectTrue(registration.active instanceof ServiceWorker);
    testing.expectEqual('activated', registration.active.state);
    testing.expectEqual('none', registration.updateViaCache);
    testing.expectEqual(new URL('./scope/', location.href).href, registration.scope);
    testing.expectEqual(new URL('./scope/sw.js', location.href).href, registration.active.scriptURL);

    const ready = await readyPromise;
    testing.expectTrue(ready === registration);

    const reply = new Promise((resolve) => {
      navigator.serviceWorker.onmessage = (event) => {
        testing.expectTrue(event instanceof MessageEvent);
        testing.expectTrue(event.source === registration.active);
        resolve(event.data);
      };
    });
    registration.active.postMessage({ answer: 42 });
    const message = await reply;
    testing.expectEqual(42, message.echo.answer);
    testing.expectEqual('window', message.sourceType);

    const byDocument = await navigator.serviceWorker.getRegistration('./scope/document.html');
    testing.expectTrue(byDocument instanceof ServiceWorkerRegistration);
    testing.expectEqual(registration.scope, byDocument.scope);
    testing.expectEqual(undefined, await navigator.serviceWorker.getRegistration('../outside.html'));

    const registrations = await navigator.serviceWorker.getRegistrations();
    testing.expectEqual(1, registrations.length);
    testing.expectEqual(registration.scope, registrations[0].scope);

    testing.expectTrue(await registration.unregister());
    testing.expectFalse(await registration.unregister());
    testing.expectEqual(0, (await navigator.serviceWorker.getRegistrations()).length);
    state.resolve();
  } catch (error) {
    console.error(error);
    testing.fail(String(error));
  }

  await state.done(() => testing.expectTrue(true));
</script>
