<!DOCTYPE html>
<script src="../testing.js"></script>

<script id="alert">
  {
    // alert should be callable without error
    window.alert('hello');
    window.alert();
    testing.expectEqual(undefined, window.alert('test'));
  }
</script>

<script id="confirm">
  {
    // confirm returns false in headless mode
    testing.expectEqual(false, window.confirm('proceed?'));
    testing.expectEqual(false, window.confirm());
  }
</script>

<script id="prompt">
  {
    // prompt returns null in headless mode
    testing.expectEqual(null, window.prompt('enter value'));
    testing.expectEqual(null, window.prompt('enter value', 'default'));
    testing.expectEqual(null, window.prompt());
  }
</script>

<script id="secure_context">
  // Derived from the origin, exactly as Chrome does it: the test server is
  // loopback, which is a trustworthy origin, so this is true. On plain http
  // to a public host it is false, which is the honest Chrome answer.
  testing.expectEqual(true, window.isSecureContext);

  // Needs COOP+COEP, which no ordinary page sends. Pages read it to decide
  // whether SharedArrayBuffer is usable.
  testing.expectEqual(false, window.crossOriginIsolated);
</script>

<script id="devicePixelRatio">
  {
    testing.expectEqual(2, window.devicePixelRatio);
  }
</script>
